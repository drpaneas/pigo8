<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Effects - PIGO-8</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
            font-family: 'Courier New', monospace;
        }

         
        canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;
        }

         
        .controls-overlay {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            background: linear-gradient(to top, rgba(17, 17, 27, 0.95) 0%, rgba(17, 17, 27, 0.8) 80%, transparent 100%);
            z-index: 100;
        }

         
        .dpad-container {
            width: 100px;
            height: 100px;
            position: relative;
        }

        .dpad-btn {
            position: absolute;
            background: linear-gradient(180deg, #313244 0%, #1e1e2e 100%);
            border: 2px solid #45475a;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
        }

        .dpad-btn:active, .dpad-btn.active {
            background: linear-gradient(180deg, #89b4fa 0%, #74c7ec 100%);
            border-color: #b4befe;
            box-shadow: 0 0 15px rgba(137, 180, 250, 0.5);
        }

        .dpad-up {
            width: 32px;
            height: 36px;
            left: 50%;
            top: 0;
            transform: translateX(-50%);
            border-radius: 6px 6px 0 0;
        }

        .dpad-down {
            width: 32px;
            height: 36px;
            left: 50%;
            bottom: 0;
            transform: translateX(-50%);
            border-radius: 0 0 6px 6px;
        }

        .dpad-left {
            width: 36px;
            height: 32px;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            border-radius: 6px 0 0 6px;
        }

        .dpad-right {
            width: 36px;
            height: 32px;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            border-radius: 0 6px 6px 0;
        }

        .dpad-center {
            width: 32px;
            height: 32px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(180deg, #1e1e2e 0%, #11111b 100%);
            border: 2px solid #313244;
            position: absolute;
        }

         
        .dpad-arrow {
            color: #6c7086;
            font-size: 12px;
            font-weight: bold;
        }

        .dpad-btn:active .dpad-arrow, .dpad-btn.active .dpad-arrow {
            color: #1e1e2e;
        }

         
        .action-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 18px;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid;
            cursor: pointer;
            user-select: none;
        }

        .btn-z {
            background: linear-gradient(180deg, #f38ba8 0%, #eb6f92 100%);
            border-color: #f5c2e7;
            color: #1e1e2e;
            box-shadow: 0 4px 0 #a6416d, 0 6px 15px rgba(243, 139, 168, 0.3);
        }

        .btn-z:active, .btn-z.active {
            box-shadow: 0 1px 0 #a6416d, 0 0 20px rgba(243, 139, 168, 0.6);
            transform: translateY(3px);
        }

        .btn-x {
            background: linear-gradient(180deg, #89b4fa 0%, #74c7ec 100%);
            border-color: #b4befe;
            color: #1e1e2e;
            box-shadow: 0 4px 0 #1e66f5, 0 6px 15px rgba(137, 180, 250, 0.3);
        }

        .btn-x:active, .btn-x.active {
            box-shadow: 0 1px 0 #1e66f5, 0 0 20px rgba(137, 180, 250, 0.6);
            transform: translateY(3px);
        }

         
        .start-btn {
            background: linear-gradient(180deg, #45475a 0%, #313244 100%);
            border: 2px solid #585b70;
            border-radius: 20px;
            padding: 6px 20px;
            color: #a6adc8;
            font-family: 'Courier New', monospace;
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 2px;
            transition: all 0.1s ease;
            text-transform: uppercase;
            cursor: pointer;
            user-select: none;
        }

        .start-btn:active, .start-btn.active {
            background: linear-gradient(180deg, #89b4fa 0%, #74c7ec 100%);
            border-color: #b4befe;
            color: #1e1e2e;
            box-shadow: 0 0 15px rgba(137, 180, 250, 0.5);
        }

         
        .loading-screen {
            background: #11111b;
            color: #cdd6f4;
        }

        .loading-dot {
            animation: pulse 1.4s ease-in-out infinite;
        }

        .loading-dot:nth-child(2) { animation-delay: 0.2s; }
        .loading-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }

         
        .brand-text {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #f38ba8, #fab387, #f9e2af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

         
        .header-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 0.75rem 1rem;
            background: linear-gradient(to bottom, rgba(17, 17, 27, 0.95) 0%, rgba(17, 17, 27, 0.8) 80%, transparent 100%);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

         
        @media (max-width: 380px) {
            .dpad-container {
                width: 85px;
                height: 85px;
            }
            
            .dpad-up, .dpad-down {
                width: 28px;
                height: 32px;
            }
            
            .dpad-left, .dpad-right {
                width: 32px;
                height: 28px;
            }
            
            .dpad-center {
                width: 28px;
                height: 28px;
            }
            
            .action-btn {
                width: 48px;
                height: 48px;
                font-size: 16px;
            }
        }

         
        @media (max-height: 450px) {
            .header-bar {
                display: none;
            }
            
            .controls-overlay {
                padding: 0.5rem;
            }
            
            .dpad-container {
                width: 80px;
                height: 80px;
            }
            
            .action-btn {
                width: 44px;
                height: 44px;
            }
        }
    </style>
</head>
<body>
    
    <div id="loading" class="loading-screen fixed inset-0 flex flex-col items-center justify-center z-50">
        <div class="text-2xl brand-text mb-4">PIGO-8</div>
        <div class="flex gap-1 text-2xl">
            <span class="loading-dot">●</span>
            <span class="loading-dot">●</span>
            <span class="loading-dot">●</span>
        </div>
        <div class="text-sm text-gray-500 mt-4">Loading Effects...</div>
    </div>

    
    <div class="header-bar">
        <div class="text-sm brand-text">PIGO-8</div>
        <div class="text-xs text-gray-500 font-mono">Effects</div>
    </div>

    

    
    <div class="controls-overlay">
        <div class="flex justify-between items-center max-w-lg mx-auto">
            
            <div class="dpad-container">
                <button class="dpad-btn dpad-up" data-button="2">
                    <span class="dpad-arrow">▲</span>
                </button>
                <button class="dpad-btn dpad-down" data-button="3">
                    <span class="dpad-arrow">▼</span>
                </button>
                <button class="dpad-btn dpad-left" data-button="0">
                    <span class="dpad-arrow">◀</span>
                </button>
                <button class="dpad-btn dpad-right" data-button="1">
                    <span class="dpad-arrow">▶</span>
                </button>
                <div class="dpad-center"></div>
            </div>

            
            <button class="start-btn" data-button="6">START</button>

            
            <div class="flex gap-2 items-center">
                <button class="action-btn btn-x" data-button="5">X</button>
                <button class="action-btn btn-z -mt-4" data-button="4">Z</button>
            </div>
        </div>
        <div class="text-center text-xs text-gray-600 mt-2">
            Keyboard: Arrow Keys + Z/X + Enter
        </div>
    </div>

    
    <script src="wasm_exec.js"></script>
    <script>
        
        const BUTTON_LEFT = 0;
        const BUTTON_RIGHT = 1;
        const BUTTON_UP = 2;
        const BUTTON_DOWN = 3;
        const BUTTON_O = 4;  
        const BUTTON_X = 5;  
        const BUTTON_START = 6;

        
        const buttonStates = {};

        
        
        let wasmReady = false;
        let pendingInputs = [];

        
        function setButton(buttonIndex, pressed) {
            if (buttonStates[buttonIndex] === pressed) return;
            buttonStates[buttonIndex] = pressed;
            
            if (wasmReady && typeof window.pigo8SetButton === 'function') {
                window.pigo8SetButton(buttonIndex, pressed);
            } else {
                
                pendingInputs.push({ buttonIndex, pressed });
            }
        }

        
        function processPendingInputs() {
            if (typeof window.pigo8SetButton === 'function') {
                pendingInputs.forEach(({ buttonIndex, pressed }) => {
                    window.pigo8SetButton(buttonIndex, pressed);
                });
            }
            pendingInputs = [];
        }

        
        function initControls() {
            const buttons = document.querySelectorAll('[data-button]');
            
            buttons.forEach(button => {
                const buttonIndex = parseInt(button.dataset.button);
                
                
                
                
                
                button.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    button.classList.add('active');
                    setButton(buttonIndex, true);
                }, { passive: false });
                
                button.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    button.classList.remove('active');
                    setButton(buttonIndex, false);
                }, { passive: false });
                
                button.addEventListener('touchcancel', (e) => {
                    e.preventDefault();
                    button.classList.remove('active');
                    setButton(buttonIndex, false);
                }, { passive: false });
                
                
                button.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    button.classList.add('active');
                    setButton(buttonIndex, true);
                });
                
                button.addEventListener('mouseup', (e) => {
                    e.preventDefault();
                    button.classList.remove('active');
                    setButton(buttonIndex, false);
                });
                
                button.addEventListener('mouseleave', (e) => {
                    button.classList.remove('active');
                    setButton(buttonIndex, false);
                });
            });

            
            document.addEventListener('contextmenu', (e) => {
                if (e.target.closest('[data-button]')) {
                    e.preventDefault();
                }
            });
        }

        
        async function loadGame() {
            const go = new Go();
            
            try {
                const response = await fetch('game.wasm');
                if (!response.ok) {
                    throw new Error('Failed to load game.wasm: ' + response.statusText);
                }
                
                const result = await WebAssembly.instantiateStreaming(response, go.importObject);
                
                
                document.getElementById('loading').style.display = 'none';
                
                
                initControls();
                
                
                go.run(result.instance);
                
                
                wasmReady = true;
                processPendingInputs();
            } catch (error) {
                console.error('Failed to load game:', error);
                document.getElementById('loading').innerHTML = `
                    <div class="text-red-400 text-center p-4">
                        <div class="text-xl mb-2">⚠️ Error</div>
                        <div class="text-sm">${error.message}</div>
                        <div class="text-xs text-gray-500 mt-4">
                            Make sure you're running from a web server,<br>
                            not opening the file directly.
                        </div>
                    </div>
                `;
            }
        }

        
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadGame);
        } else {
            loadGame();
        }
    </script>
</body>
</html>

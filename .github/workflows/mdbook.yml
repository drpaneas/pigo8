# Sample workflow for building and deploying a mdBook site to GitHub Pages
#
# To get started with mdBook see: https://rust-lang.github.io/mdBook/index.html
#
name: Website

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]
    paths:
      - 'book.toml'
      - '.github/workflows/mdbook.yml'
      - 'docs/**'
      - 'examples/**'
      - 'cmd/webexport/**'
      - 'cmd/editor/**'
      - 'internal/webbuild/**'
  pull_request:
    paths:
      - 'book.toml'
      - '.github/workflows/mdbook.yml'
      - 'docs/**'
      - 'examples/**'
      - 'cmd/webexport/**'
      - 'cmd/editor/**'
      - 'internal/webbuild/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.4.36
    steps:
      - uses: actions/checkout@v6
      - name: Set up Go environment
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
      - name: Install mdBook
        run: |
          curl --proto '=https' --tlsv1.2 https://sh.rustup.rs -sSf -y | sh
          rustup update
          cargo install --version ${MDBOOK_VERSION} mdbook
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with mdBook
        run: mdbook build
      - name: Build web game exports
        run: |
          # Build WASM exports for the demos referenced in docs/SUMMARY.md
          # directly into the book output via the cmd/webexport tool.
          # Each example is its own Go module (go.mod/go.sum are gitignored,
          # not committed), so initialize one pointing at this checkout
          # before invoking webexport, which just runs `go build` in-place.
          for example in pong animation gameboy hello_world map spritesheet bigSprite flashlight map_layers; do
            dir="./examples/$example"
            if [ ! -f "$dir/go.mod" ]; then
              (cd "$dir" && \
                go mod init "github.com/drpaneas/pigo8/examples/$example" && \
                echo "replace github.com/drpaneas/pigo8 => ../.." >> go.mod && \
                go mod tidy)
            fi
            go run ./cmd/webexport -game "$dir" -o "./book/$example"
          done
      - name: Build editor web export
        run: |
          # cmd/editor is part of the repo's root module (not a standalone
          # example under examples/*), so it's built directly, unlike the
          # loop above which sets up a throwaway go.mod per example first.
          go run ./cmd/webexport -game ./cmd/editor -o ./book/editor -title "PIGO8 Editor"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./book

  # Deploys to PIGO8 github
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (Production)
        id: deployment
        uses: actions/deploy-pages@v4

  # e.g. deploys to: https://drpaneas.github.io/pigo8/deploy-preview/42/
  preview:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages (PR Preview)
        id: deployment
        uses: actions/deploy-pages@v4
